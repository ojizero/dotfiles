# Global Bun configuration
# Symlinked to ~/.bunfig.toml via bootstrap

[install]
# Delay resolution to versions published at least 7 days ago
# Mitigates supply chain attacks from compromised recent publishes
minimumReleaseAge = 604800

# Keep these aligned with mise's top-level npm tool exclusions. Duplication is
# intentional: mise does not forward its exclusions to Bun. Bun also needs the
# dependency-only packages listed here because its policy covers the complete
# dependency graph. Playwright and playwright-core intentionally remain gated.
minimumReleaseAgeExcludes = [
  "@agentclientprotocol/claude-agent-acp",
  "@agentclientprotocol/sdk",
  "@anthropic-ai/claude-agent-sdk",
  "@playwright/cli",
  "@zed-industries/codex-acp",
  "@zed-industries/codex-acp-darwin-arm64",
  "@earendil-works/pi-coding-agent",
]

# NOTE: Bun blocks lifecycle scripts by default. Its built-in trusted list
# (~367 packages) cannot be disabled globally via bunfig.toml.
# Per-project control: set "trustedDependencies" in package.json.
# Tracking: https://github.com/oven-sh/bun/issues/7642
