# Ubuntu desktop module: apps, keyboard, power and Docker for a GNOME workstation.
# Select it per machine in ~/.config/mise/miserc.local.toml (env = ["linux-desktop"]);
# containers and servers leave it out and get only the base config.

# Vendor apt repositories (mise writes /etc/apt/sources.list.d/mise-<name>.sources)
[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/ubuntu"
key = "https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg"
fingerprint = "2596A99EAAB33821893C0A79458CA832957F5868"

[bootstrap.apt.sources.helium]
uris = "https://pkg.helium.computer/deb"
suites = "stable"
key = "https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc"
fingerprint = "BE677C1989D35EAB2C5F26C9351601AD01D6378E"

[bootstrap.apt.sources.docker]
uris = "https://download.docker.com/linux/ubuntu"
components = "stable"
key = "https://download.docker.com/linux/ubuntu/gpg"
fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"

[bootstrap.packages]

# Apps whose daemon or Chromium sandbox needs a system install (AppArmor profiles ship with the .deb).
# Cursor manages its own apt source, so extras.setup installs its .deb instead.
"apt:tailscale" = "latest"
"apt:helium-bin" = "latest"
# Docker Engine from Docker's repository (system service; the docker group gives passwordless access)
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"

# Lid closed on AC keeps the machine running
[bootstrap.files."/etc/systemd/logind.conf.d/60-server-on-ac.conf"]
source = "bootstrap/linux/files/logind-lid-on-ac.conf"

# xremap writes through /dev/uinput
[bootstrap.files."/etc/udev/rules.d/99-mac-keyboard-uinput.rules"]
source = "bootstrap/linux/files/uinput.rules"

[bootstrap.files."/etc/modules-load.d/mac-keyboard-uinput.conf"]
source = "bootstrap/linux/files/uinput-modules.conf"

[bootstrap.files."/etc/apparmor.d/t3code-appimage"]
source = "bootstrap/linux/files/apparmor-t3code-appimage"
notify = ["apparmor"]

[bootstrap.services.apparmor]
on_change = "reload"

[bootstrap.services.tailscaled]
state = "running"

[bootstrap.services.docker]
state = "running"

[dotfiles]

"~/.config/xremap" = "xremap"
"~/.config/systemd/user/mac-keyboard.service" = "xremap/mac-keyboard.service"

[tasks.bootstrap]

run = 'zsh "${DOTFILES_PATH}/bootstrap/linux/extras.setup"'
