min_version = "2026.7.14"

[settings.dotfiles]
default_mode = "symlink"

[task_config]
includes = ["bootstrap/tasks"]

[dotfiles]

"~/.zshrc" = "zsh/zshrc"
"~/.zprofile" = "zsh/zprofile"
"~/.bashrc" = "bash/bashrc"
"~/.bash_profile" = "bash/bash_profile"
"~/.config/git" = "git"
"~/.bunfig.toml" = "bun/bunfig.toml"
"~/.config/mise/config.toml" = "mise/config.toml"
"~/.config/mise/config.local.toml" = "mise/config.local.toml"
"~/.config/mise/tasks" = "mise/tasks"
# Merged, not linked: each OS adds its own keys (mise.<os>.toml), and keys
# Claude Code writes stay on the machine. Keys removed here stay there too.
"~/.claude/settings.json/shared" = { source = "claude/settings.json", merge = true }
"~/.claude/statusline-command.sh" = "claude/statusline-command.sh"
"~/.config/uv" = "uv"
"~/.config/ghostty" = "ghostty"
"~/.config/rex" = "rex"
"~/.config/nvim" = "nvim"
"~/.config/zed" = "zed"
"~/.config/worktrunk" = "worktrunk"
"~/.pi/agent/settings.json" = "pi/agent/settings.json"
"~/.pi/agent/extensions" = "pi/agent/extensions"
"~/.codex/rules/host-tools.rules" = "codex/rules/host-tools.rules"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
"~/.claude/CLAUDE.md" = "agents/AGENTS.md"
# Cursor has no global AGENTS.md; it reads `.cursor/rules` in ancestor dirs,
# and needs the `alwaysApply` frontmatter, so render it on top of AGENTS.md.
"~/.cursor/rules/agents.mdc" = { source = "agents/cursor.mdc.tera", mode = "template" }
# Rendered, not linked: agents/merge-config.ts merges the machine's optional,
# gitignored agents/agents.local.toml on top of agents/agents.toml.
"~/.agents/agents.toml" = { source = "agents/agents.toml.tera", mode = "template" }
"~/.agents/sources/rex" = "rex/skills/rex"

[bootstrap.repos]

"~/workspace/self/dotfiles" = { url = "ssh://git@ssh-forge.ojizero.dev/ojizero/dotfiles.git", ref = "master" }

[bootstrap.packages]

# Homebrew formulae and font casks for every device. mise installs them itself
# (it never runs `brew`) into Homebrew's prefix, so `brew` manages them after.
# OS-specific packages live in mise.macos.toml and mise.linux.toml.
"brew:anomalyco/tap/opencode" = "latest"
"brew:bat" = "latest"
"brew:cloudflared" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:flyctl" = "latest"
"brew:forgejo-cli" = "latest"
"brew:fx" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:git-lfs" = "latest"
"brew:glab" = "latest"
"brew:glow" = "latest"
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:mise" = "latest"
"brew:mkcert" = "latest"
"brew:ncdu" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:sheets" = "latest"
"brew:shellcheck" = "latest"
"brew:tree" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:viu" = "latest"
"brew:websocat" = "latest"
"brew:worktrunk" = "latest"
"brew:zoxide" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"

[bootstrap.hooks.pre-packages]

run = '''
# Homebrew stays for day-to-day use and the casks mise cannot install
export NONINTERACTIVE=1
if ! command -v brew >/dev/null 2>&1; then
  /usr/bin/env bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  case "$(uname -s)/$(uname -m)" in
    Darwin/arm64)
      eval "$(/opt/homebrew/bin/brew shellenv)"
      ;;
    Darwin/x86_64)
      eval "$(/usr/local/bin/brew shellenv)"
      ;;
    Linux/*)
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      ;;
  esac
fi
'''

[bootstrap.hooks.pre-dotfiles]

# `seed-local` creates a `[dotfiles]` source that is not repo content. A missing
# source aborts the whole apply, so it must exist before it runs. This also
# fires on the standalone `mise bootstrap dotfiles apply`, so it self-heals.
# `seed-local` is a task because hooks get neither `[env]` nor templates.
# Hooks before the tools step skip `mise run`'s tool auto-install, which would
# otherwise install (and on Linux, compile) every tool before dotfiles exist.
run = "MISE_TASK_RUN_AUTO_INSTALL=0 mise run dotfiles:seed-local"

[bootstrap.hooks.post-dotfiles]

run = "mkdir -p ~/.config ~/.local/nvim ~/.pi/agent"

[bootstrap.hooks.post-tools]

run = ["mise run dotfiles:trust", "mise run dotfiles:agents"]
