min_version = "2026.7.14"

[tools]

# Primary tech stacks
uv = "latest"
bun = "1.3.14"
erlang = "28"
elixir = "1.19.5-otp-28"

# Tooling managed via mise (Aube package manager)
"github:earendil-works/pi" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:@sentry/dotagents" = "latest"

# Needed as runtime for some NPM based tooling
node = "lts"

[env]

# Canonical dotfiles clone path (all repos live under ~/workspace/...)
DOTFILES_PATH = "{{ env.HOME }}/workspace/self/dotfiles"

MISE_ENV_FILE = ".env"
ERL_AFLAGS = "-kernel shell_history enabled"

[settings]

minimum_release_age = "7d"

# Install npm: tools with the Aube package manager embedded in mise. This does
# not install or require the standalone Aube CLI.
npm.package_manager = "aube"

# mise applies its minimum release age while resolving fuzzy top-level tool
# versions (such as "latest"). For npm: and pipx: tools it also forwards the
# cutoff to Aube/uv for transitive dependency resolution. Exclusions here match
# mise tool IDs and disable mise's cutoff for those tools. GitHub release tools
# do not need an Aube exclusion.
minimum_release_age_excludes = [
  "npm:@agentclientprotocol/claude-agent-acp",
  "npm:@playwright/cli",
  "npm:@zed-industries/codex-acp",
  "github:earendil-works/pi",
]

dotfiles.default_mode = "symlink"

[settings.github]

credential_command = "gh auth token"

[settings.pipx]

uvx = true

[hooks]

# Inline run (not `{ task = "auto:git-sync" }`) because:
# 1. Task hooks execute via `mise run`, which does not forward MISE_ORIGINAL_CWD,
#    so the script would check the wrong directory and silently skip.
# 2. Inline run avoids the mise task wrapper line for quieter cd hooks.
cd = { run = "{{ env.HOME }}/.config/mise/tasks/auto/git-sync" }

[dotfiles]

"~/.local" = ".local"
"~/.brew-aliases" = ".brew-aliases"
"~/.zshrc" = ".zshrc"
"~/.zprofile" = ".zprofile"
"~/.gitconfig" = ".gitconfig"
"~/.config/git/ignore" = "git/ignore"
"~/.bunfig.toml" = "bunfig.toml"
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/mise/config.local.toml" = "mise.local.toml"
"~/.config/mise/tasks" = "mise/tasks"
"~/.claude/settings.json" = ".claude/settings.json"
"~/.claude/statusline-command.sh" = ".claude/statusline-command.sh"
"~/.claude-x/settings.json" = ".claude-x/settings.json"
"~/.claude-x/statusline-command.sh" = ".claude/statusline-command.sh"
"~/.config/uv" = "uv"
"~/.config/ghostty" = "ghostty"
"~/.config/nvim" = "nvim"
"~/.config/zed" = "zed"
"~/.config/worktrunk" = "worktrunk"
"~/.pi/agent/settings.json" = ".pi/agent/settings.json"
"~/.pi/agent/extensions" = ".pi/agent/extensions"
"~/.codex/rules/host-tools.rules" = ".codex/rules/host-tools.rules"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
"~/.claude/CLAUDE.md" = "agents/AGENTS.md"
"~/.claude-x/CLAUDE.md" = "agents/AGENTS.md"
# Cursor has no global AGENTS.md; it reads `.cursor/rules` in ancestor dirs,
# and needs the `alwaysApply` frontmatter at the top of AGENTS.md.
"~/.cursor/rules/agents.mdc" = "agents/AGENTS.md"
"~/.agents/agents.toml" = "dotagent/agents.toml"
# dotagents refuses local skills outside `~/.agents`, so link this one directly.
"~/.agents/skills/housekeeping" = "mise/tasks/housekeeping/skill"

# dotagents only links `~/.claude/skills`, so mirror it for the alternate
# profile. The source is generated, not repo content, so the pre-dotfiles hook
# below guarantees it exists — a missing source aborts the whole apply.
"~/.claude-x/skills" = "~/.agents/skills"

[bootstrap.repos]

"~/workspace/self/dotfiles" = { url = "ssh://git@ssh-forge.ojizero.dev/ojizero/dotfiles.git", ref = "master" }

[bootstrap.packages]

# Homebrew formulae and font casks for every device. mise installs them itself
# (it never runs `brew`) into Homebrew's prefix, so `brew` manages them after.
# OS-specific packages live in mise.macos.toml and mise.linux.toml.
"brew:anomalyco/tap/opencode" = "latest"
"brew:bat" = "latest"
"brew:cloudflared" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:flyctl" = "latest"
"brew:forgejo-cli" = "latest"
"brew:fx" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:git-lfs" = "latest"
"brew:glab" = "latest"
"brew:glow" = "latest"
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:mise" = "latest"
"brew:mkcert" = "latest"
"brew:ncdu" = "latest"
"brew:neovim" = "latest"
"brew:oh-my-posh" = "latest"
"brew:ripgrep" = "latest"
"brew:sheets" = "latest"
"brew:shellcheck" = "latest"
"brew:tree" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:viu" = "latest"
"brew:websocat" = "latest"
"brew:worktrunk" = "latest"
"brew:zoxide" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"

[bootstrap.hooks.pre-packages]

run = '''
# Homebrew stays for day-to-day use and the casks mise cannot install
export NONINTERACTIVE=1
if ! command -v brew >/dev/null 2>&1; then
  /usr/bin/env bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  case "$(uname -s)/$(uname -m)" in
    Darwin/arm64)
      eval "$(/opt/homebrew/bin/brew shellenv)"
      ;;
    Darwin/x86_64)
      eval "$(/usr/local/bin/brew shellenv)"
      ;;
    Linux/*)
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      ;;
  esac
fi
'''

[bootstrap.hooks.pre-dotfiles]

# Both entries create a `[dotfiles]` source that is not repo content. A missing
# source aborts the whole apply, so they must exist before it runs. This also
# fires on the standalone `mise bootstrap dotfiles apply`, so both self-heal.
# `seed-local` is a task because hooks get neither `[env]` nor templates.
# Hooks before the tools step skip `mise run`'s tool auto-install, which would
# otherwise install (and on Linux, compile) every tool before dotfiles exist.
run = ["mkdir -p ~/.agents/skills", "MISE_TASK_RUN_AUTO_INSTALL=0 mise run dotfiles:seed-local"]

[bootstrap.hooks.post-dotfiles]

run = "mkdir -p ~/.config ~/.local/nvim ~/.pi/agent"

[bootstrap.hooks.post-tools]

run = ["mise run dotfiles:trust", "mise run dotfiles:agents"]
