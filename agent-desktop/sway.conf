# Headless Sway for the agent desktop (computer-use module). Do not include
# /etc/sway/config or its config.d: they import this display into the systemd
# user manager, which GNOME shares.

xwayland disable
output HEADLESS-1 resolution 1920x1080 position 0 0

# Share the display with the other agent-desktop services and with the services
# D-Bus starts on the private bus (AT-SPI, dconf, portals)
exec ~/.config/agent-desktop/run --announce
