# T2 MacBook module (https://t2linux.org): kernel, audio, Touch Bar and firmware.
# Select it alongside linux-desktop: env = ["linux-desktop", "t2"].

[bootstrap.apt.sources.t2]
uris = "https://adityagarg8.github.io/t2-ubuntu-repo"
suites = "./"
key = "https://adityagarg8.github.io/t2-ubuntu-repo/KEY.gpg"
fingerprint = ["9F9873A566A73E27CFF0294FE2E496114ACDBFD4", "7C22844512DAEA8E8B44D85348DC9F9CC66D3FAF"]

[bootstrap.apt.sources.t2-release]
uris = "https://github.com/AdityaGarg8/t2-ubuntu-repo/releases/download/resolute"
suites = "./"
key = "https://adityagarg8.github.io/t2-ubuntu-repo/KEY.gpg"
fingerprint = ["9F9873A566A73E27CFF0294FE2E496114ACDBFD4", "7C22844512DAEA8E8B44D85348DC9F9CC66D3FAF"]

[bootstrap.packages]
"apt:linux-t2" = "latest"
"apt:apple-t2-audio-config" = "latest"
"apt:apple-firmware-script" = "latest"
"apt:tiny-dfr" = "latest"
"apt:t2-touchid" = "latest"

# Kernel parameters the T2 needs; run `sudo update-grub` after changing them
[bootstrap.files."/etc/default/grub.d/90-t2.conf"]
source = "bootstrap/linux/files/grub-t2.cfg"
