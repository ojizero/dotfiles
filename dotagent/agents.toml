version = 1

agents = ["claude", "cursor", "codex", "opencode", "pi"]

minimum_release_age = 10080
minimum_release_age_exclude = ["git:git@ssh-forge.ojizero.dev:ojizero/skills.git"]

[trust]

github_repos = ["mattpocock/skills", "cursor/plugins"]

# `github_orgs` does not cover a self-hosted forge; non-GitHub sources are
# matched on domain plus path prefix instead.
git_domains = ["ssh-forge.ojizero.dev/ojizero"]

[[skills]]
name = "cortex"
source = "git:git@ssh-forge.ojizero.dev:ojizero/cortex.git"

[[skills]]
name = "pr-create"
source = "git:git@ssh-forge.ojizero.dev:ojizero/skills.git"

[[skills]]
name = "pr-babysit"
source = "git:git@ssh-forge.ojizero.dev:ojizero/skills.git"

[[skills]]
name = "writing-for-agents"
source = "mattpocock/skills"

# `cursor/plugins` is plugin-shaped, so `dotagents add` would pull every skill
# in it. A hand-written entry with an explicit `path` takes just this one.
[[skills]]
name = "unslop"
source = "cursor/plugins"
path = "pstack/skills/unslop"

